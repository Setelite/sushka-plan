name: Import clean Sushka hero image
on:
  push:
    paths:
      - '.github/workflows/import-sushka-photo.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download cleaned fitness couple
        env:
          PHOTO_URL: "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/1b6ebc2eb28e112ffeb85928f6f77f787a23c49bc0311bf053988b312824dcaf.webp"
        run: |
          mkdir -p assets
          curl --fail --location --retry 3 --max-time 90 --silent --show-error "$PHOTO_URL" -o assets/sushka-couple-clean-v2.webp
          test "$(wc -c < assets/sushka-couple-clean-v2.webp)" -gt 40000
          file assets/sushka-couple-clean-v2.webp
      - name: Commit image to this repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/sushka-couple-clean-v2.webp
          git diff --cached --quiet || (git commit -m "Add cleaned Sushka hero image" && git push)
